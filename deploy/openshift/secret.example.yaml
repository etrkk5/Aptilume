# Template only. Fill values in the cluster/vault; never commit a filled Secret.
# Import as runtime environment variables for bootstrap, API and worker.
apiVersion: v1
kind: Secret
metadata:
  name: aptilume-secrets
type: Opaque
stringData:
  BOOTSTRAP_ADMIN_PASSWORD: "<ADMIN_PASSWORD_15_TO_128_CHARACTERS>"
  BOOTSTRAP_HR_PASSWORD: "<HR_PASSWORD_15_TO_128_CHARACTERS>"
  SECRET_ENCRYPTION_KEY: "<PERSISTENT_FERNET_KEY>"
  DATABASE_URL: "postgresql+psycopg://USER:URL_ENCODED_PASSWORD@HOST:5432/aptilume?sslmode=verify-full&sslrootcert=/etc/certs/postgres-ca.crt"
